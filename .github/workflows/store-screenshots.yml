name: Store screenshots

# Takes the Play Store screenshots from the real app on a 1080x1920 emulator, with invented sample files and a clean
# status bar (demo mode). The PNGs are in the "store-screenshots" artifact.
on:
  pull_request:
    paths:
      - "app/src/androidTest/java/com/saraltechies/saralfilemanager/StoreScreenshotsTest.kt"
      - ".github/workflows/store-screenshots.yml"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 6000M
          script: |
            ./gradlew installDebug installDebugAndroidTest --stacktrace
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0930
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e fully true
            adb shell am broadcast -a com.android.systemui.demo -e command network -e mobile show -e level 4 -e datatype none -e fully true
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            # All files access and usage access, as a person would switch them on in Settings.
            adb shell appops set --uid com.saraltechies.saralfilemanager.debug MANAGE_EXTERNAL_STORAGE allow
            adb shell appops set com.saraltechies.saralfilemanager.debug GET_USAGE_STATS allow
            adb shell am instrument -w -e class com.saraltechies.saralfilemanager.StoreScreenshotsTest com.saraltechies.saralfilemanager.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.saraltechies.saralfilemanager.debug/files/screenshots/. screenshots/ || true
            grep -q "OK (" instrument.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: store-screenshots
          path: screenshots/
