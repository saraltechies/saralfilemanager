name: App check

# A wide check on emulators: the oldest supported Android, a current one, the newest, and a small dark screen with large
# text. Results (screenshots, timings, crash logs) are in the "app-check-*" artifacts.
on:
  push:
    branches: [app-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android-8-oldest, api: 26, target: default, tough: "0" }
          - { name: android-14, api: 34, target: google_apis, tough: "0" }
          - { name: android-16-newest, api: 36, target: google_apis, tough: "0" }
          - { name: android-14-small-dark-large-text, api: 34, target: google_apis, tough: "1" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make a real test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 20 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac check-video.mp4
      - name: Check on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TOUGH: ${{ matrix.tough }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_2
          disk-size: 6000M
          emulator-boot-timeout: 900
          script: bash .github/scripts/app-check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-check-${{ matrix.name }}
          path: check-output/
